[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-srs"
version = "0.2.0"
description = "Automated spaced-repetition deck builder using disciplined Anki design principles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Neil Clark", email = "neilgordonclark@gmail.com"}]
dependencies = [
    "genanki>=0.13",
    "Pillow>=10",
    "PyMuPDF>=1.23",
    "zstandard>=0.22",
]

[project.scripts]
lint-deck = "anki_deck_author.scripts.lint_deck:main"
verify-deck = "anki_deck_author.scripts.verify_deck:main"

[tool.hatch.build.targets.wheel]
packages = ["anki_deck_author"]
